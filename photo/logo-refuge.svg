<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Refuge Edile Lacroix</title>
  <desc id="d">Logo : une patte d'animal dans une maison, sur fond vert émeraude</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Pastille -->
  <circle cx="100" cy="100" r="84" fill="url(#g)"/>
  <!-- Maison (le refuge) -->
  <path d="M100 38 L160 88 V150 H40 V88 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
  <!-- Patte (les animaux) -->
  <g fill="#059669">
    <ellipse cx="100" cy="122" rx="23" ry="17"/>
    <ellipse cx="74" cy="96" rx="8" ry="11" transform="rotate(-20 74 96)"/>
    <ellipse cx="90" cy="82" rx="8" ry="11" transform="rotate(-6 90 82)"/>
    <ellipse cx="110" cy="82" rx="8" ry="11" transform="rotate(6 110 82)"/>
    <ellipse cx="126" cy="96" rx="8" ry="11" transform="rotate(20 126 96)"/>
  </g>
  <!-- Texte -->
  <g font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif">
    <text x="205" y="94" font-size="42" font-weight="800" fill="#0f172a" letter-spacing="1">REFUGE</text>
    <text x="205" y="126" font-size="22" font-weight="700" fill="#059669" letter-spacing="1.5">EDILE LACROIX</text>
    <text x="206" y="152" font-size="13" font-weight="600" fill="#64748b" letter-spacing="5">MAUBEUGE</text>
  </g>
</svg>
